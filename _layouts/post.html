---
layout: default
---

<article class="post">
  <h1>{{ page.title }}</h1>

  <div class="entry">
    {{ content }}
  </div>

  <div class="date">
    Written on {{ page.date | date: "%B %e, %Y" }}
  </div>

  {% include disqus.html %}
</article>

<!-- Verified MathJax CDN distribution script powered by jsDelivr -->
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" id="MathJax-script" async></script>

<script>
  document.addEventListener("DOMContentLoaded", function() {
    const postBody = document.querySelector(".entry");
    if (!postBody) return;
    let html = postBody.innerHTML;

    // 1. PRE-CLEANUP: Restores text split across formatting blocks inside brackets
    html = html.replace(/\[([^\]]+)\]/g, function(match) {
      return match.replace(/<\/?em>/gi, '/');
    });

    // 2. PARSE LIBRARY ENTRIES: [Title|Author|URL] -> Layout Box
    html = html.replace(/\[([^\]|]+)\|([^\]|]+)\|([^\]\s<]+)\]/g, function(match, title, author, url) {
      let href = url.trim().replace(/<[^>]*>/g, '');
      if (!/^https?:\/\//i.test(href) && !href.startsWith('/')) {
        href = 'https://' + href;
      }
      return `
        <div class="library-card" style="border: 1px solid #e0e0e0; border-left: 4px solid #007acc; padding: 15px; margin: 15px 0; background-color: #f9f9f9; border-radius: 4px; display: flex; flex-direction: column; gap: 5px;">
          <span class="book-title" style="font-weight: bold; font-size: 1.1em; color: #333;">${title.trim()}</span>
          <span class="book-author" style="font-style: italic; color: #666; font-size: 0.95em;">by ${author.trim()}</span>
          <a href="${href}" class="pdf-download-btn" target="_blank" style="display: inline-block; align-self: flex-start; margin-top: 5px; background-color: #007acc; color: white !important; padding: 4px 10px; border-radius: 4px; text-decoration: none; font-size: 0.85em;">📥 Resource Link</a>
        </div>
      `;
    });

    // 3. PARSE STANDARD MEDIAWIKI LINKS: [Text|URL] -> Inline Hyperlink
    html = html.replace(/\[([^\]|]+)\|([^\]\s<]+)\]/g, function(match, text, url) {
      let href = url.trim().replace(/<[^>]*>/g, ''); 
      if (!/^https?:\/\//i.test(href) && !href.startsWith('/')) {
        href = 'https://' + href;
      }
      return `<a href="${href}" class="mediawiki-link">${text.trim()}</a>`;
    });

    // 4. PARSE HIGHLIGHTS: ==text== -> Highlight tags
    html = html.replace(/==([^=]+)==/g, '<mark class="wiki-highlight">$1</mark>');

    // 5. PARSE SLASHES: /text/ -> Italics
    html = html.replace(/\/(?![^<>]*>)([^\/\s][^\/]*?[^\/\s]|[^\/\s])\//g, '<em>$1</em>');

    postBody.innerHTML = html;

    // 6. PROCESS LATE X MATHEMATICAL FORMULAS
    if (window.MathJax) {
      window.MathJax.typesetPromise([postBody]);
    }
  });
</script>
