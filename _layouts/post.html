---
layout: default
---

<article class="post">
  <h1>{{ page.title }}</h1>

  <div class="entry">
    {{ content }}
  </div>

  <div class="date">
    Written on {{ page.date | date: "%B %e, %Y" }}
  </div>

  {% include disqus.html %}
</article>

<script src="https://jsdelivr.net" id="MathJax-script" async></script>

<script>
  document.addEventListener("DOMContentLoaded", function() {
    const postBody = document.querySelector(".entry");
    if (!postBody) return
    let html = postBody.innerHTML;

    html = html.replace(/\[([^\]|]+)\|([^\]\s<]+)\]/g, function(match, text, url) {
      let href = url.trim();
      href = href.replace(/<[^>]*>/g, ''); 
      if (!/^https?:\/\//i.test(href) && !href.startsWith('/')) {
        href = 'https://' + href;
      }
      return `<a href="${href}" class="mediawiki-link">${text.trim()}</a>`;
    });

    html = html.replace(/==([^=]+)==/g, '<mark class="wiki-highlight">$1</mark>');

    html = html.replace(/(?<!https?:)\/([^\/\s][^\/]*?[^\/\s]|[^\/\s])\//g, '<em>$1</em>');

    postBody.innerHTML = html;

    if (window.MathJax) {
      window.MathJax.typesetPromise([postBody]);
    }
  });
</script>
